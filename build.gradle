plugins {
	id 'org.springframework.boot' version '2.6.0'
	id 'io.spring.dependency-management' version '1.0.11.RELEASE'
	id 'java'
	id "io.freefair.lombok" version "6.3.0"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

ext['jackson-bom.version'] = '2.21.8'
ext['kafka.version'] = '4.4.0'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.core:jackson-annotations'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.apache.kafka:kafka-streams-test-utils'

	implementation 'org.apache.kafka:kafka-streams'
	// Patched implementations of the Kafka client's record compression codecs.
	runtimeOnly 'at.yawk.lz4:lz4-java:1.11.4'
	runtimeOnly 'org.xerial.snappy:snappy-java:1.1.10.9'
}

test {
	useJUnitPlatform()
}
